<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#bbdff5">
  <meta name="description" content="Chạm một bông hoa, đánh thức cả khu vườn.">
  <title>Cả một vườn thương · 20/10</title>
  <script>
    if (sessionStorage.getItem('gift_unlocked') !== 'true') {
      window.location.replace('./index.html' + window.location.hash);
    }
  </script>
  <link rel="preload" href="./assets/fonts/noto-serif-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/fonts/noto-sans-regular.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Noto Serif";
      src: url("./assets/fonts/noto-serif-regular.woff2") format("woff2");
      font-style: normal; font-weight: 400; font-display: swap;
    }
    @font-face {
      font-family: "Noto Serif";
      src: url("./assets/fonts/noto-serif-italic.woff2") format("woff2");
      font-style: italic; font-weight: 400; font-display: swap;
    }
    @font-face {
      font-family: "Noto Sans";
      src: url("./assets/fonts/noto-sans-regular.woff2") format("woff2");
      font-style: normal; font-weight: 400; font-display: swap;
    }
    :root {
      color-scheme: light;
      --sky: #bbdff5;
      --ink: #703a50;
      --muted: #936779;
      --rose: #c66388;
      --leaf: #6c8b71;
      --paper: #fffdfc;
      --font-letter: "Noto Serif", serif;
      font-family: "Noto Sans", sans-serif;
      color: var(--ink);
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; min-width: 280px; min-height: 100%; }
    body { background: var(--sky); -webkit-tap-highlight-color: transparent; }
    button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
    .garden {
      position: relative; min-height: 560px; height: 100svh; overflow: hidden;
      isolation: isolate;
      background: linear-gradient(180deg, #bbdff5 0%, #d8edf9 37%, #edf7fb 70%, #f2f7ec 100%);
    }
    .garden::after {
      content: ""; position: absolute; inset: 0; z-index: -2; pointer-events: none;
      background: radial-gradient(ellipse at 50% 110%, #d7e8caaa, transparent 58%);
      opacity: 0; transition: opacity 4s;
    }
    .garden.is-growing::after { opacity: 1; }
    .page-header {
      position: absolute; top: max(28px, env(safe-area-inset-top));
      left: clamp(24px, 5vw, 76px); right: clamp(24px, 5vw, 76px);
      display: flex; align-items: start; justify-content: space-between; gap: 24px;
      pointer-events: none;
    }
    .dedication { margin: 0; font: italic 20px/1.6 var(--font-letter); }
    .date { margin: 0; text-align: right; font-size: 11px; line-height: 1.7; color: var(--muted); }
    .date span { display: block; font: 28px/1.4 var(--font-letter); color: var(--ink); margin-bottom: 5px; }
    #flowers { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; }
    .flower-button {
      position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
      width: 184px; height: 184px; border: 0; border-radius: 50%; background: transparent;
    }
    .flower-button::after {
      content: ""; position: absolute; inset: 8px; border: 1px solid #d69ab23b; border-radius: 50%;
      transition: transform .5s, border-color .5s;
    }
    @media (hover: hover) {
      .flower-button:hover::after { transform: scale(1.13); border-color: #c6638888; }
    }
    .garden:not(.is-growing):not(.is-ready) { cursor: pointer; }
    .intro {
      position: absolute; left: 24px; right: 24px; top: 19%; text-align: center;
      transition: opacity .65s, transform .65s; pointer-events: none;
    }
    h1 { margin: 0; font: 400 clamp(25px, 3vw, 35px)/1.5 var(--font-letter); }
    .intro p { margin: 13px 0 0; font-size: 13px; line-height: 1.7; color: var(--muted); }
    .is-growing .intro { opacity: 0; transform: translateY(12px); }
    .progress {
      position: absolute; bottom: 36px; left: 20px; right: 20px; margin: 0;
      text-align: center; font: italic 17px/1.7 var(--font-letter);
      opacity: 0; transition: opacity .6s; pointer-events: none;
      text-shadow: 0 1px 12px #fff, 0 1px 8px #fff;
    }
    .is-growing:not(.is-ready) .progress { opacity: 1; }
    .garden-actions {
      position: absolute; bottom: max(24px, env(safe-area-inset-bottom)); left: 0; right: 0;
      display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; padding: 0 16px;
    }
    .garden-actions button {
      border: 1px solid #dcb9c8; background: #fffdfcf2; border-radius: 30px;
      padding: 12px 20px; font-size: 12px; box-shadow: 0 3px 16px #76364d0c;
    }
    .garden-actions button:hover { background: #fae7ef; }
    dialog {
      width: min(480px, calc(100% - 36px)); max-height: calc(100svh - 36px);
      padding: 0; border: 0; overflow: auto; background: var(--paper); color: var(--ink);
      box-shadow: 0 24px 100px #69394d24, 0 2px 10px #69394d12;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    dialog::-webkit-scrollbar { display: none; }
    dialog::backdrop { background: #eaf5fc3d; backdrop-filter: blur(3px); }
    dialog[open] { animation: unfold 1s cubic-bezier(.2,.8,.2,1) both; }
    .letter { position: relative; padding: 38px 42px 28px; text-align: center; }
    .letter::before { content: ""; position: absolute; inset: 10px; border: 1px solid #eed6e1; pointer-events: none; }
    .close-card { position: absolute; top: 15px; right: 16px; width: 34px; height: 34px; border: 0; background: transparent; font-size: 25px; }
    .letter-date { margin: 2px 0 20px; font: 24px/1.4 var(--font-letter); color: var(--rose); }
    .letter-date span { display: inline-block; width: 1px; height: 27px; background: #d9aec1; transform: rotate(24deg); margin: 0 15px -5px; }
    .letter-sprig { display: block; margin: 0 auto 17px; width: 75px; height: 55px; }
    .recipient { font: italic 17px/1.7 var(--font-letter); margin: 0 0 13px; }
    h2 { font: 400 clamp(26px, 5vw, 32px)/1.5 var(--font-letter); margin: 0 0 24px; text-wrap: balance; }
    .message { font-size: 14px; line-height: 1.95; margin: 0 0 15px; text-wrap: pretty; }
    .signature { margin: 24px 0; font: italic 17px/1.8 var(--font-letter); }
    .recipient, h2, .message, .signature { overflow-wrap: anywhere; }
    h2, .message, .signature { white-space: pre-wrap; }
    .letter-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 20px; }
    .view-garden { position: relative; border: 0; border-bottom: 1px solid #cba1b2; padding: 7px 2px; background: transparent; font-size: 12px; }
    .card-editor { text-align: left; }
    .card-editor h2 { text-align: center; margin-bottom: 20px; font-size: 25px; }
    .card-editor label { display: block; margin: 16px 0 7px; font-size: 13px; }
    .card-editor input, .card-editor textarea {
      display: block; width: 100%; min-width: 0; padding: 10px 12px;
      border: 1px solid #dcb9c8; border-radius: 4px; background: #fff9fb;
      color: var(--ink); font: 16px/1.6 "Noto Sans", sans-serif;
    }
    .card-editor textarea { resize: vertical; }
    .editor-hint, .card-status { color: var(--muted); font-size: 12px; line-height: 1.7; }
    .card-status { margin: 0; }
    .card-status:not(:empty) { margin-top: 16px; }
    .editor-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
    .save-card { border: 1px solid var(--ink); border-radius: 24px; padding: 11px 18px; background: var(--ink); color: var(--paper); font-size: 13px; }
    .noscript { position: absolute; top: 30%; left: 20px; right: 20px; text-align: center; line-height: 1.8; }
    @keyframes unfold { from { opacity: 0; transform: translateY(35px) rotate(-2deg) scale(.94); } to { opacity: 1; transform: none; } }
    @media (max-width: 600px) {
      .dedication { font-size: 18px; max-width: 150px; }
      .date { max-width: 130px; font-size: 10px; }
      .date span { font-size: 25px; }
      .letter { padding: 35px 26px 25px; }
      .intro { top: 18%; }
      h1 { font-size: clamp(23px, 5.8vw, 28px); }
    }
    @media (max-height: 600px) and (min-width: 600px) {
      .garden { min-height: 360px; }
      .intro { top: 38%; right: auto; width: 30%; text-align: left; }
      h1 { font-size: 24px; }
      .intro p { margin-top: 6px; }
      .page-header { top: 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="garden" id="garden">
    <header class="page-header">
      <p class="dedication">Dành tặng bạn cả một vườn thương.</p>
      <p class="date"><span>20 / 10</span>Ngày Phụ nữ Việt Nam</p>
    </header>
    <canvas id="flowers" aria-hidden="true"></canvas>
    <button class="flower-button" id="bloom" type="button" aria-label="Chạm để cả vườn hoa nở" aria-describedby="introHint"></button>
    <div class="intro" id="intro">
      <h1>Từ bông hoa nhỏ…</h1>
      <p id="introHint">Chạm vào hoa, một điều dịu dàng đang chờ cậu.</p>
    </div>
    <p class="progress" id="status" role="status" aria-live="polite" aria-atomic="true"></p>
    <nav class="garden-actions" id="actions" aria-label="Vườn hoa và thiệp" hidden>
      <button id="replay" type="button">Cho hoa nở lại</button>
    </nav>
    <dialog id="wishCard" aria-labelledby="cardTitle">
      <article class="letter">
        <button class="close-card" id="closeCard" type="button" aria-label="Đóng thiệp">×</button>
        <p class="letter-date">20<span aria-hidden="true"></span>10</p>
        <svg class="letter-sprig" viewBox="0 0 90 64" fill="none" aria-hidden="true">
          <path d="M45 59 Q41 40 46 21 M44 49 Q25 47 23 35 Q39 33 44 49 M44 40 Q60 39 65 28 Q51 28 44 40" stroke="#78947a" stroke-width="1.2" fill="#dfe9d9"/>
          <g fill="#ecc1d2" stroke="#c9789a" stroke-width=".6">
            <ellipse cx="39" cy="17" rx="8" ry="12" transform="rotate(-40 39 17)"/>
            <ellipse cx="52" cy="17" rx="8" ry="12" transform="rotate(40 52 17)"/>
            <ellipse cx="45" cy="15" rx="8" ry="12"/>
            <path d="M30 19 Q44 17 45 30 Q33 32 30 19 M60 19 Q46 17 45 30 Q58 32 60 19"/>
          </g>
        </svg>
        <div id="cardReading">
          <h2 id="cardTitle" style="font-size: 28px; line-height: 1.4; margin: 12px 0 24px;">Tặng cậu một vườn hoa</h2>
          <div class="letter-actions">
            <button class="view-garden" id="viewGarden" type="button" autofocus>Ngắm vườn hoa</button>
          </div>
        </div>
      </article>
    </dialog>
    <noscript><p class="noscript">Bật JavaScript để chạm vào hoa và mở thiệp nhé.<br>Chúc bạn ngày 20/10 bình an, rạng rỡ và tràn đầy yêu thương!</p></noscript>
  </main>
  <script src="./config.js"></script>
  <script src="./garden-botany.js"></script>
  <script>
    (() => {
      'use strict';
      const garden = document.getElementById('garden');
      const canvas = document.getElementById('flowers');
      const ctx = canvas.getContext('2d');
      const bloomButton = document.getElementById('bloom');
      const card = document.getElementById('wishCard');
      const actions = document.getElementById('actions');
      const status = document.getElementById('status');
      const motion = matchMedia('(prefers-reduced-motion: reduce)');
      const TAU = Math.PI * 2;
      const clamp = n => Math.max(0, Math.min(1, n));
      const ease = n => 1 - Math.pow(1 - clamp(n), 3);
      let seed = 2010;
      const random = () => { seed = seed * 16807 % 2147483647; return (seed - 1) / 2147483646; };
      const { createRealisticRoseSprite, createHydrangeaSprite, createRoseBudSprite, createSpiderLilySprite, drawBotanicalLeaf } = window.GardenBotany;

      // Cập nhật câu chữ từ cấu hình GiftConfig nếu có
      const cfg = (typeof window.GiftConfig !== 'undefined' && window.GiftConfig.get)
        ? window.GiftConfig.get()
        : null;
      if (cfg) {
        const dedicationEl = document.querySelector('.dedication');
        const cardTitleEl = document.getElementById('cardTitle');
        if (dedicationEl && cfg.dedication) dedicationEl.textContent = cfg.dedication;
        if (cardTitleEl && cfg.gardenCardTitle) cardTitleEl.textContent = cfg.gardenCardTitle;
      }
      const paletteKeys = ['sweetBlush', 'pastelPink', 'creamPeach', 'pearlVintage', 'berryRomance', 'paleGreen', 'skyBlue', 'pearlWhite'];
      // Bake the soft focus and bloom into the sprites once, keeping the live scene light.
      function softenPetals(source, logicalSize, radius) {
        const image = document.createElement('canvas');
        image.width = source.width; image.height = source.height;
        const c = image.getContext('2d');
        const pixelRatio = source.width / logicalSize;
        c.globalAlpha = .3;
        c.filter = `blur(${radius * .13 * pixelRatio}px) brightness(1.35)`;
        c.drawImage(source, 0, 0);
        c.globalAlpha = 1;
        c.filter = `blur(${radius * .009 * pixelRatio}px) brightness(1.06)`;
        c.drawImage(source, 0, 0);
        return image;
      }
      // Use the same layered roses as index.html, cached at the sizes used in this scene.
      // Fully open flowers need only one draw instead of repainting every petal each frame.
      function prepareRose(config) {
        const rose = createRealisticRoseSprite(config);
        rose.whorlCanvases = rose.whorlCanvases.map(layer => softenPetals(layer, rose.logicalSize, rose.radius));
        const openCanvas = document.createElement('canvas');
        openCanvas.width = rose.baseCanvas.width;
        openCanvas.height = rose.baseCanvas.height;
        const c = openCanvas.getContext('2d');
        c.drawImage(rose.baseCanvas, 0, 0);
        rose.whorlCanvases.forEach(layer => c.drawImage(layer, 0, 0));
        return { ...rose, openCanvas };
      }

      function prepareHydrangea(config) {
        const hyd = createHydrangeaSprite(config);
        hyd.whorlCanvases = hyd.whorlCanvases.map(layer => softenPetals(layer, hyd.logicalSize, hyd.radius));
        const openCanvas = document.createElement('canvas');
        openCanvas.width = hyd.baseCanvas.width;
        openCanvas.height = hyd.baseCanvas.height;
        const c = openCanvas.getContext('2d');
        c.drawImage(hyd.baseCanvas, 0, 0);
        hyd.whorlCanvases.forEach(layer => c.drawImage(layer, 0, 0));
        return { ...hyd, openCanvas };
      }

      // Cánh đồng cẩm tú cầu 4 màu (Xanh dương, Xanh ngọc, Trắng, Hồng pastel)
      const hydrangeaPaletteKeys = ['skyBlue', 'tealJade', 'pureWhite', 'pastelPink'];
      const hydrangeaSprites = hydrangeaPaletteKeys.flatMap((paletteKey, i) => ['garden', 'classic', 'peony'].map((variety, j) => prepareHydrangea({
        radius: 46, paletteKey, density: 'dense', seed: 2010 + i * 107 + j * 41,
        tiltX: (j - 1) * .65, tiltY: -.2 + (i % 5) * .08, hasDewdrop: j === 0
      })));

      // Hoa hồng nở rộ như ban đầu với 4 tầng cánh xoắn ốc (Sweet Blush, Pastel Pink, Cream Peach, Berry Romance, Pearl White, Pale Green, Sky Blue, Pearl Vintage)
      const rosePaletteKeys = ['sweetBlush', 'pastelPink', 'creamPeach', 'berryRomance', 'pearlWhite', 'paleGreen', 'skyBlue', 'pearlVintage'];
      const roseSprites = rosePaletteKeys.flatMap((paletteKey, i) => ['garden', 'classic', 'peony'].map((variety, j) => prepareRose({
        radius: 46, paletteKey, variety, seed: 101 + i * 83 + j * 37,
        tiltX: (j - 1) * .65, tiltY: -.2 + (i % 5) * .08, hasDewdrop: j === 0
      })));
      function prepareSpiderLily(config) {
        const lily = createSpiderLilySprite(config);
        lily.whorlCanvases = lily.whorlCanvases.map((layer, idx) => {
          if (idx === 3) return layer; // Keep the intricate filaments & golden anthers razor-sharp!
          return softenPetals(layer, lily.logicalSize, lily.radius);
        });
        const openCanvas = document.createElement('canvas');
        openCanvas.width = lily.baseCanvas.width;
        openCanvas.height = lily.baseCanvas.height;
        const c = openCanvas.getContext('2d');
        c.drawImage(lily.baseCanvas, 0, 0);
        lily.whorlCanvases.forEach(layer => c.drawImage(layer, 0, 0));
        return { ...lily, openCanvas };
      }
      const heroSprite = prepareSpiderLily({ radius: 82, seed: 2010, hasDewdrop: true });
      const budSprites = paletteKeys.map(paletteKey => {
        const bud = createRoseBudSprite({ paletteKey });
        return { ...bud, canvas: softenPetals(bud.canvas, bud.logicalSize, bud.radius) };
      });
      const leafCanvas = document.createElement('canvas');
      leafCanvas.width = 300; leafCanvas.height = 200;
      const leafContext = leafCanvas.getContext('2d');
      leafContext.scale(2, 2);
      drawBotanicalLeaf(leafContext, 20, 50, 0, 100, 31);
      // 1. Soft cumulus cloud canvas (Mây bồng bềnh)
      const cloudCanvas = document.createElement('canvas');
      cloudCanvas.width = 760; cloudCanvas.height = 380;
      const cloudContext = cloudCanvas.getContext('2d');
      const cloudPuffs = [
        [135, 174, 98, .56], [240, 148, 126, .72], [355, 118, 112, .86],
        [448, 146, 118, .78], [552, 168, 114, .66], [638, 182, 82, .48],
        [360, 192, 235, .34], [220, 198, 92, .44], [490, 196, 96, .46]
      ];
      cloudPuffs.forEach(([x, y, radius, opacity]) => {
        cloudContext.save(); cloudContext.translate(x, y); cloudContext.scale(1, .62);
        const puff = cloudContext.createRadialGradient(0, -radius * .14, radius * .16, 0, 0, radius);
        puff.addColorStop(0, `rgba(255,255,255,${opacity})`);
        puff.addColorStop(.48, `rgba(255,255,255,${opacity * .88})`);
        puff.addColorStop(.8, `rgba(255,255,255,${opacity * .32})`);
        puff.addColorStop(1, 'rgba(255,255,255,0)');
        cloudContext.fillStyle = puff; cloudContext.beginPath(); cloudContext.arc(0, 0, radius, 0, TAU); cloudContext.fill();
        cloudContext.restore();
      });

      // 2. Wispy cirrus cloud canvas (Mây dải mềm mỏng nhẹ)
      const cloudCanvas2 = document.createElement('canvas');
      cloudCanvas2.width = 680; cloudCanvas2.height = 240;
      const cCtx2 = cloudCanvas2.getContext('2d');
      const wisps = [
        [120, 120, 110, 55, .42], [240, 110, 140, 68, .55], [370, 115, 160, 72, .58],
        [490, 125, 130, 60, .48], [590, 135, 85, 42, .35]
      ];
      wisps.forEach(([x, y, rx, ry, op]) => {
        cCtx2.save(); cCtx2.translate(x, y);
        const grad = cCtx2.createRadialGradient(0, 0, ry * 0.2, 0, 0, rx);
        grad.addColorStop(0, `rgba(255,255,255,${op})`);
        grad.addColorStop(0.6, `rgba(255,255,255,${op * 0.65})`);
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        cCtx2.fillStyle = grad;
        cCtx2.beginPath(); cCtx2.ellipse(0, 0, rx, ry, 0, 0, TAU); cCtx2.fill();
        cCtx2.restore();
      });

      // Diverse layered clouds across the sky
      const clouds = [
        { x: .04, y: .06, size: .48, opacity: .76, speed: 1.8, canvas: cloudCanvas2 },
        { x: .52, y: .05, size: .54, opacity: .72, speed: 2.2, canvas: cloudCanvas2 },
        { x: .22, y: .13, size: .44, opacity: .88, speed: 3.2, canvas: cloudCanvas },
        { x: .75, y: .11, size: .50, opacity: .85, speed: 2.6, canvas: cloudCanvas },
        { x: .96, y: .17, size: .38, opacity: .80, speed: 3.5, canvas: cloudCanvas },
        { x: .10, y: .23, size: .36, opacity: .65, speed: 4.0, canvas: cloudCanvas },
        { x: .46, y: .21, size: .46, opacity: .74, speed: 3.6, canvas: cloudCanvas2 },
        { x: .82, y: .27, size: .34, opacity: .60, speed: 4.4, canvas: cloudCanvas }
      ];

      // Golden sunlight motes floating in the air (Bụi nắng lung linh)
      const sunMotes = Array.from({ length: 26 }, () => ({
        x: random(),
        y: 0.05 + random() * 0.65,
        size: 1.4 + random() * 2.2,
        speed: 10 + random() * 16,
        phase: random() * TAU,
        opacity: 0.55 + random() * 0.45
      }));
      const whorlDelays = [0, .12, .24, .34];
      const closedScales = [.44, .36, .28, .38];
      const twistAngles = [.52, -.78, 1.05, -1.35];
      const flowers = [];
      // Distant flowers are smaller and paler; foreground flowers grow taller and fuller.
      // Densely packed lush hydrangea fields across 6 depth layers (360+ flowers)
      for (let row = 0; row < 6; row++) {
        const count = 38 + row * 6;
        for (let i = 0; i < count; i++) {
          const x = (i + random()) / count;
          flowers.push({
            x, y: .42 + row * .088 + (random() - .5) * .16, depth: row,
            radius: 16 + row * 5.5 + random() * 14,
            stem: .18 + random() * .22,
            bend: (random() - .5) * 65,
            phase: random() * TAU, rotation: (random() - .5) * .9,
            sprite: Math.floor(random() * hydrangeaSprites.length),
            delay: .25 + Math.abs(x - .5) * 3.8 + row * .32 + random() * .8,
            alpha: .6 + row * .08, tilt: .8 + random() * .2,
            offsetX: 0, offsetY: 0, hover: 0
          });
        }
      }
      // 48 graceful Tulip flowers standing tall across all depth layers
      for (let i = 0; i < 48; i++) {
        const row = Math.floor(i / 8);
        flowers.push({
          x: (i % 8 + .15 + random() * .7) / 8,
          y: .38 + row * .085 + (random() - .5) * .08,
          depth: row, radius: 16 + row * 3.6 + random() * 5,
          stem: .24 + random() * .18, bend: (random() - .5) * 38,
          phase: random() * TAU, rotation: (random() - .5) * .5,
          bud: true, sprite: i * 3 % budSprites.length,
          delay: .4 + random() * 2.6 + row * .35,
          alpha: .8 + row * .04, tilt: 1,
          offsetX: 0, offsetY: 0, hover: 0
        });
      }
      flowers.sort((a, b) => a.depth === b.depth ? a.y - b.y : a.depth - b.depth);

      const petalColors = [
        ['#EDF5FF', '#689DE0'], // Blue
        ['#EDFAF8', '#4EBAAF'], // Teal
        ['#FFFFFF', '#C8DBD2'], // White
        ['#FFF5F8', '#F392B0'], // Pastel Pink
        ['#FFF0F2', '#E61C3D']  // Crimson Spider Lily petal
      ];
      const petals = Array.from({ length: 48 }, () => {
        const pair = petalColors[Math.floor(random() * petalColors.length)];
        return {
          x: random(), y: random(),
          phase: random() * TAU,
          size: 3.5 + random() * 5,
          speed: 8 + random() * 12,
          c1: pair[0], c2: pair[1]
        };
      });
      const hero = { x: .5, y: .46, radius: 80, stem: .25, bend: 3, phase: 0, rotation: -.05, tilt: .98, offsetX: 0, offsetY: 0, hover: 0 };
      const pointer = { x: -1000, y: -1000 };
      let width = 0, height = 0, scale = 1, frame = 0, lastFrame = 0;
      let sceneTime = 0;
      let state = 'idle', started = 0, pausedAt = 0;

      function leaf(x, y, direction, size, flutter) {
        ctx.save(); ctx.translate(x, y); ctx.scale(direction, 1); ctx.rotate(-.58 + flutter);
        ctx.drawImage(leafCanvas, -size * .2, -size * .5, size * 1.5, size);
        ctx.restore();
      }

      function drawFlower(f, growth, time, smoothing, isHero = false) {
        if (growth <= 0) return;
        const p = ease(growth);
        const x = f.x * width;
        const targetY = f.y * height;
        const root = Math.max(height * 1.04, targetY + f.stem * height);
        const y = root - (root - targetY) * p;
        // A traveling breeze bends taller stems more, with a small individual flutter.
        const wind = motion.matches ? 0 : Math.sin(time * .00125 + f.x * 4.5) * .72 + Math.sin(time * .002 + f.phase) * .28;
        const lean = wind * (isHero ? .06 : .048);
        const sway = Math.sin(lean) * (root - y) * p;
        const r = f.radius * scale;
        const dx = x - pointer.x, dy = y - pointer.y;
        const distance = Math.hypot(dx, dy);
        const proximity = !motion.matches && !card.open ? clamp(1 - distance / (r * 2.3)) : 0;
        f.offsetX += ((dx / (distance || 1)) * proximity * r * .13 - f.offsetX) * smoothing;
        f.offsetY += ((dy / (distance || 1)) * proximity * r * .08 - f.offsetY) * smoothing;
        f.hover += (proximity - f.hover) * smoothing;
        const headX = x + sway + f.offsetX;
        const headY = y + (1 - Math.cos(lean)) * (root - y) + f.offsetY;
        const baseX = x + f.bend * scale;
        const controlX1 = x - f.bend * scale + sway * .15;
        const controlY1 = root - (root - headY) * .4;
        const controlX2 = headX + 8 * scale + sway * .12;
        const controlY2 = headY + (root - headY) * .22;
        ctx.save(); ctx.globalAlpha = isHero ? 1 : Math.min(1, f.alpha) * clamp(growth * 3);
        const stemColor = ctx.createLinearGradient(baseX - 2, root, headX + 2, headY);
        if (isHero) {
          // Hoa Bỉ Ngạn leafless scape: deep green transitioning into crimson-wine at the top
          stemColor.addColorStop(0, '#2D4A30');
          stemColor.addColorStop(0.65, '#48724C');
          stemColor.addColorStop(0.88, '#6B3542');
          stemColor.addColorStop(1, '#8C1D2E');
        } else {
          stemColor.addColorStop(0, '#46664c'); stemColor.addColorStop(.5, '#789265'); stemColor.addColorStop(1, '#587b53');
        }
        ctx.strokeStyle = stemColor;
        ctx.lineWidth = isHero ? 3.4 * scale : Math.max(1, r * .05);
        ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(baseX, root);
        ctx.bezierCurveTo(controlX1, controlY1, controlX2, controlY2, headX, headY);
        ctx.stroke();
        // Lycoris radiata flowers bloom without leaves ("hoa nở không thấy lá")
        if (growth > .15 && !isHero) {
          [.38, .64].forEach((t, i) => {
            const u = 1 - t;
            const lx = u ** 3 * baseX + 3 * u * u * t * controlX1 + 3 * u * t * t * controlX2 + t ** 3 * headX;
            const ly = u ** 3 * root + 3 * u * u * t * controlY1 + 3 * u * t * t * controlY2 + t ** 3 * headY;
            const length = r * .95 * p;
            leaf(lx, ly, i ? -1 : 1, length, wind * .085);
          });
        }
        ctx.translate(headX, headY);
        ctx.rotate(f.rotation + wind * .095 + f.offsetX * .003);
        const breath = motion.matches ? 1 : 1 + Math.sin(time * .0014 + f.phase) * .008;
        ctx.scale(breath * (1 + f.hover * .04), f.tilt * breath * (1 + f.hover * .04));
        const flower = f.isRose ? roseSprites[f.sprite] : (isHero ? heroSprite : hydrangeaSprites[f.sprite]);
        const size = flower.logicalSize * r / flower.radius;
        if (growth >= 1) {
          ctx.drawImage(flower.openCanvas, -size / 2, -size / 2, size, size);
        } else {
          ctx.save(); ctx.scale(.5 + p * .5, .5 + p * .5);
          ctx.drawImage(flower.baseCanvas, -size / 2, -size / 2, size, size); ctx.restore();
          flower.whorlCanvases.forEach((layer, i) => {
            const open = ease((growth - whorlDelays[i]) / (1 - whorlDelays[i]));
            const unfurl = closedScales[i] + (1 - closedScales[i]) * open;
            ctx.save(); ctx.rotate((1 - open) * twistAngles[i]);
            ctx.scale(unfurl, unfurl * (.78 + open * .22));
            ctx.drawImage(layer, -size / 2, -size / 2, size, size); ctx.restore();
          });
        }
        ctx.restore();
      }

      function drawPetals(elapsed, time) {
        ctx.save();
        petals.forEach(petal => {
          const x = ((petal.x * width + time * .009 + Math.sin(time * .0006 + petal.phase) * 35) % (width + 60)) - 30;
          const y = ((petal.y * height + time * petal.speed * .001) % (height + 60)) - 30;
          ctx.save(); ctx.globalAlpha = Math.min(elapsed / 3, 1) * .55;
          ctx.translate(x, y); ctx.rotate(petal.phase + time * .0007);
          ctx.scale(.55 + Math.abs(Math.sin(time * .001 + petal.phase)) * .45, 1);
          const color = ctx.createLinearGradient(0, -petal.size, 0, petal.size);
          color.addColorStop(0, petal.c1); color.addColorStop(1, petal.c2); ctx.fillStyle = color;
          ctx.beginPath(); ctx.moveTo(0, -petal.size);
          ctx.bezierCurveTo(petal.size * 1.3, -petal.size, petal.size * .8, petal.size * .8, 0, petal.size);
          ctx.bezierCurveTo(-petal.size, petal.size * .2, -petal.size * .6, -petal.size * .9, 0, -petal.size);
          ctx.fill(); ctx.restore();
        });
        ctx.restore();
      }

      // Draw warm morning sun, radiating god-rays, and drifting golden sun motes
      function drawSunlight(time) {
        const sunX = width * 0.76;
        const sunY = height * 0.11;
        const sunRadius = Math.max(width * 0.52, 420);

        ctx.save();
        // 1. Warm Golden Sun Halo
        const sunHalo = ctx.createRadialGradient(sunX, sunY, 15, sunX, sunY, sunRadius);
        sunHalo.addColorStop(0, 'rgba(255, 252, 238, 0.45)');
        sunHalo.addColorStop(0.18, 'rgba(255, 246, 210, 0.28)');
        sunHalo.addColorStop(0.45, 'rgba(255, 235, 180, 0.12)');
        sunHalo.addColorStop(0.75, 'rgba(255, 225, 160, 0.04)');
        sunHalo.addColorStop(1, 'rgba(255, 225, 160, 0)');
        ctx.fillStyle = sunHalo;
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunRadius, 0, TAU);
        ctx.fill();

        // 2. Radiant Sunbeams (Vạt nắng xiên rọi qua bầu trời)
        const rays = [
          { angle: 0.56 * Math.PI, width: 0.11, length: 1.35, phase: 0 },
          { angle: 0.63 * Math.PI, width: 0.16, length: 1.55, phase: 1.4 },
          { angle: 0.70 * Math.PI, width: 0.14, length: 1.48, phase: 2.8 },
          { angle: 0.77 * Math.PI, width: 0.18, length: 1.65, phase: 4.1 },
          { angle: 0.84 * Math.PI, width: 0.12, length: 1.40, phase: 5.3 }
        ];

        rays.forEach(ray => {
          const shimmer = motion.matches ? 1 : 0.85 + Math.sin(time * 0.0009 + ray.phase) * 0.15;
          const rayLen = Math.max(height * ray.length, width * 0.9);
          const a1 = ray.angle - ray.width * 0.5;
          const a2 = ray.angle + ray.width * 0.5;

          const p1x = sunX + Math.cos(a1) * 35;
          const p1y = sunY + Math.sin(a1) * 35;
          const p2x = sunX + Math.cos(a1) * rayLen;
          const p2y = sunY + Math.sin(a1) * rayLen;
          const p3x = sunX + Math.cos(a2) * rayLen;
          const p3y = sunY + Math.sin(a2) * rayLen;
          const p4x = sunX + Math.cos(a2) * 35;
          const p4y = sunY + Math.sin(a2) * 35;

          ctx.beginPath();
          ctx.moveTo(p1x, p1y);
          ctx.lineTo(p2x, p2y);
          ctx.lineTo(p3x, p3y);
          ctx.lineTo(p4x, p4y);
          ctx.closePath();

          const rayGrad = ctx.createLinearGradient(sunX, sunY, (p2x + p3x) * 0.5, (p2y + p3y) * 0.5);
          rayGrad.addColorStop(0, `rgba(255, 252, 235, ${0.22 * shimmer})`);
          rayGrad.addColorStop(0.35, `rgba(255, 246, 210, ${0.14 * shimmer})`);
          rayGrad.addColorStop(0.7, `rgba(255, 238, 190, ${0.05 * shimmer})`);
          rayGrad.addColorStop(1, 'rgba(255, 235, 180, 0)');

          ctx.fillStyle = rayGrad;
          ctx.fill();
        });

        ctx.restore();
      }

      function drawSunMotes(time) {
        if (motion.matches) return;
        ctx.save();
        sunMotes.forEach(mote => {
          const x = ((mote.x * width + time * 0.008 + Math.sin(time * 0.0007 + mote.phase) * 24) % (width + 60)) - 30;
          const y = ((mote.y * height - time * mote.speed * 0.0006) % (height + 40));
          const actualY = y < -20 ? y + height + 40 : y;
          const alpha = (0.35 + Math.sin(time * 0.0012 + mote.phase) * 0.25) * mote.opacity;

          ctx.save();
          ctx.fillStyle = `rgba(255, 250, 220, ${alpha})`;
          ctx.shadowColor = 'rgba(255, 235, 170, 0.6)';
          ctx.shadowBlur = 6;
          ctx.beginPath();
          ctx.arc(x, actualY, mote.size, 0, TAU);
          ctx.fill();
          ctx.restore();
        });
        ctx.restore();
      }

      function drawClouds(time) {
        ctx.save();
        clouds.forEach(cloud => {
          const cImg = cloud.canvas || cloudCanvas;
          const cloudWidth = Math.max(240, width * cloud.size);
          const travel = width + cloudWidth * 2;
          const x = ((cloud.x * width + time * cloud.speed * .001 + cloudWidth) % travel) - cloudWidth;
          const y = height * cloud.y;
          ctx.globalAlpha = cloud.opacity;
          ctx.drawImage(cImg, x - cloudWidth * .5, y - cloudWidth * .18, cloudWidth, cloudWidth * cImg.height / cImg.width);
        });
        ctx.restore();
      }

      let hasOpenedCard = false;
      function openCard() {
        if (!card.open) card.showModal();
      }
      function finish() {
        state = 'ready'; garden.classList.add('is-ready'); actions.hidden = false;
        status.textContent = 'Cả vườn hoa đã nở. ' + ((cfg && cfg.gardenCardTitle) ? cfg.gardenCardTitle : 'Tặng cậu một vườn hoa') + '.';
        if (!hasOpenedCard) {
          hasOpenedCard = true;
          openCard();
        }
      }
      function draw(time) {
        frame = 0;
        const delta = lastFrame ? Math.min(50, time - lastFrame) : 16.67;
        lastFrame = time;
        if (!motion.matches) sceneTime += delta;
        const smoothing = motion.matches ? 1 : 1 - Math.exp(-delta / 140);
        ctx.clearRect(0, 0, width, height);
        drawSunlight(sceneTime);
        drawClouds(sceneTime);
        const elapsed = state === 'idle' ? 0 : (time - started) / 1000;
        const instant = motion.matches && state !== 'idle';
        if (state !== 'idle') {
          flowers.forEach(f => drawFlower(f, state === 'ready' || instant ? 1 : clamp((elapsed - f.delay) / 1.9), sceneTime, smoothing));
        }
        drawFlower(hero, state === 'idle' ? .72 : state === 'ready' || instant ? 1 : .72 + .28 * clamp(elapsed / 1.8), sceneTime, smoothing, true);
        if (state !== 'idle' && !motion.matches) drawPetals(elapsed, sceneTime);
        drawSunMotes(sceneTime);
        if (state === 'growing' && (instant || elapsed >= 6.8)) finish();
        if (!motion.matches && !document.hidden) frame = requestAnimationFrame(draw);
      }
      function render() {
        cancelAnimationFrame(frame);
        if (!document.hidden) frame = requestAnimationFrame(draw);
      }
      garden.addEventListener('pointermove', event => {
        if (event.pointerType !== 'mouse' || motion.matches) return;
        const rect = garden.getBoundingClientRect();
        pointer.x = event.clientX - rect.left; pointer.y = event.clientY - rect.top;
      });
      garden.addEventListener('pointerleave', () => { pointer.x = pointer.y = -1000; });
      function resize() {
        const rect = garden.getBoundingClientRect();
        width = rect.width; height = rect.height;
        scale = Math.min(1.22, Math.max(.68, width / 1100));
        const dpr = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0); render();
      }
      function start() {
        if (state !== 'idle') return;
        state = 'growing'; started = performance.now();
        garden.classList.add('is-growing'); bloomButton.hidden = true;
        document.getElementById('intro').setAttribute('aria-hidden', 'true');
        status.textContent = 'Đánh thức đóa hoa nhỏ, cả khu vườn thức giấc…'; render();
      }
      function closeCard() { card.close(); }
      bloomButton.addEventListener('click', start);
      bloomButton.addEventListener('pointerdown', (e) => { if (e.isPrimary) start(); });
      garden.addEventListener('click', (e) => {
        if (state === 'idle' && !e.target.closest('.page-header') && !e.target.closest('.garden-actions') && !e.target.closest('dialog')) {
          start();
        }
      });
      garden.addEventListener('pointerdown', (e) => {
        if (state === 'idle' && e.isPrimary && !e.target.closest('.page-header') && !e.target.closest('.garden-actions') && !e.target.closest('dialog')) {
          start();
        }
      });
      document.getElementById('closeCard').addEventListener('click', closeCard);
      document.getElementById('viewGarden').addEventListener('click', closeCard);
      card.addEventListener('close', () => {
        const replayBtn = document.getElementById('replay');
        if (replayBtn && !actions.hidden) replayBtn.focus({ preventScroll: true });
      });
      document.getElementById('replay').addEventListener('click', () => {
        state = 'idle'; garden.classList.remove('is-growing', 'is-ready');
        actions.hidden = true; bloomButton.hidden = false; status.textContent = '';
        document.getElementById('intro').removeAttribute('aria-hidden');
        bloomButton.focus({ preventScroll: true }); render();
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { pausedAt = performance.now(); cancelAnimationFrame(frame); frame = 0; lastFrame = 0; }
        else { if (pausedAt && state === 'growing') started += performance.now() - pausedAt; pausedAt = 0; render(); }
      });
      motion.addEventListener('change', render);
      new ResizeObserver(resize).observe(garden);
      resize();
    })();
  </script>
</body>
</html>
